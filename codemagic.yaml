
workflows:
  ios-ipa:
    name: Build iOS app
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_PROJECT: "DiscordWeb.xcodeproj"
        XCODE_SCHEME: "DiscordWeb"
      xcode: latest
    scripts:
      - name: Build unsigned app archive
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/DiscordWeb.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive
    artifacts:
      - build/DiscordWeb.xcarchive/**
      
