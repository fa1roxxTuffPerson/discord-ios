workflows:
  ios-ipa:
    name: Build iOS app
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: development
        bundle_identifier: com.fa1roxxtuffperson.discordweb
      vars:
        XCODE_PROJECT: "DiscordWeb.xcodeproj"
        XCODE_SCHEME: "DiscordWeb"
      xcode: latest
    scripts:
      - name: Build signed IPA
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
